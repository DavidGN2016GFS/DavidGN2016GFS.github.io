<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>David Gozar – Data Analyst Portfolio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f7fa;
            color: #333;
        }
        header {
            background: #0f172a;
            color: white;
            padding: 60px 20px;
            text-align: center;
        }
        header h1 { margin: 0; font-size: 2.5rem; }
        header p { margin-top: 10px; font-size: 1.1rem; opacity: 0.9; }

        .lang-switch {
            position: absolute;
            top: 15px;
            right: 15px;
        }
        .lang-switch button {
            padding: 8px 14px;
            margin-left: 5px;
            border: none;
            border-radius: 6px;
            background: #334155;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        
        .container {
            max-width: 1100px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #0f172a;
            margin-top: 0;
            border-left: 6px solid #0f172a;
            padding-left: 10px;
        }

        .section { margin-bottom: 50px; }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        .skill-box {
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #0f172a;
            font-size: 0.95rem;
        }

        .project {
            background: #fafafa;
            border-left: 5px solid #0f172a;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
        }
        .project h3 { margin: 0; color: #0f172a; }

        a { color: #0f172a; font-weight: bold; text-decoration: none; }
        a:hover { text-decoration: underline; }

        footer {
            margin-top: 40px;
            padding: 25px;
            background: #0f172a;
            color: white;
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <header>
        <div class="lang-switch">
            <button onclick="setLang('es')">ES</button>
            <button onclick="setLang('en')">EN</button>
        </div>

        <h1 data-es="David Gozar" data-en="David Gozar">David Gozar</h1>

           data-en="Data Analyst | SQL | Power BI | Python | Machine Learning"></p>

               data-en="I am a data analyst with experience in predictive modeling, executive dashboards, and report automation. I help companies transform data into strategic decisions using machine learning, statistical analysis, and data visualization."></p>
        </div>

        <!-- Habilidades -->
        <div class="section">
            <h2 data-es="Habilidades Técnicas" data-en="Technical Skills"></h2>

            <div class="skills-grid">
                <div class="skill-box" 
                     data-es="<strong>Lenguajes:</strong> Python (Pandas, NumPy, scikit-learn), SQL (MySQL, PostgreSQL), DAX"
                     data-en="<strong>Languages:</strong> Python (Pandas, NumPy, scikit-learn), SQL (MySQL, PostgreSQL), DAX"></div>

                <div class="skill-box"
                     data-es="<strong>Herramientas:</strong> Power BI, Excel avanzado, Jupyter, GitHub"
                     data-en="<strong>Tools:</strong> Power BI, Advanced Excel, Jupyter, GitHub"></div>

                <div class="skill-box"
                     data-es="<strong>Machine Learning:</strong> Clasificación, regresión, Random Forest, SVM, MLP, NLP básico"
                     data-en="<strong>Machine Learning:</strong> Classification, regression, Random Forest, SVM, MLP, basic NLP"></div>

                <div class="skill-box"
                     data-es="<strong>Otras:</strong> Web scraping, ETL, visualización, optimización de consultas"
                     data-en="<strong>Others:</strong> Web scraping, ETL, visualization, query optimization"></div>
            </div>
        </div>

        <!-- Servicios -->
        <div class="section">
            <h2 data-es="Servicios" data-en="Services"></h2>
            <ul>
                <li data-es="Análisis de datos e insights accionables"
                    data-en="Data analysis and actionable insights"></li>
                <li data-es="Dashboards ejecutivos en Power BI"
                    data-en="Executive dashboards in Power BI"></li>
                <li data-es="Modelos predictivos (machine learning)"
                    data-en="Predictive models (machine learning)"></li>
                <li data-es="Automatización de reportes en Python"
                    data-en="Report automation with Python"></li>
                <li data-es="Limpieza y transformación de datos"
                    data-en="Data cleaning and transformation"></li>
                <li data-es="Consultoría en bases de datos y SQL"
                    data-en="Database and SQL consulting"></li>
                <li data-es="Desarrollo de indicadores KPI"
                    data-en="KPI development"></li>
            </ul>
        </div>

        <!-- Logros -->
        <div class="section">
            <h2 data-es="Logros Destacados" data-en="Key Achievements"></h2>
            <ul>
                <li data-es="Aumento del recall de modelos en +35% mediante tuning y técnicas de balanceo."
                    data-en="Improved model recall by +35% using tuning and balancing techniques."></li>
                <li data-es="Reducción del tiempo de reportes en 80% con automatización."
                    data-en="Reduced reporting time by 80% through automation."></li>
                <li data-es="Optimización de consultas SQL con mejora de hasta 70% en tiempos."
                    data-en="Optimized SQL queries achieving up to 70% faster execution times."></li>
                <li data-es="Dashboards utilizados por equipos de ventas, finanzas y operaciones."
                    data-en="Dashboards used by sales, finance, and operations teams."></li>
            </ul>
        </div>

        <!-- Proyectos -->
        <div class="section">
            <h2 data-es="Proyectos Destacados" data-en="Featured Projects"></h2>

            <div class="project">
                <h3 data-es="Customer Support Satisfaction Prediction"
                    data-en="Customer Support Satisfaction Prediction"></h3>
                <p>Kaggle: <a href="">Dataset</a></p>
                <p>GitHub: <a href="">Repositorio</a></p>
                <p data-es="Modelos SVM, Random Forest y ANN para predecir insatisfacción del cliente."
                   data-en="SVM, Random Forest, and ANN models to predict customer dissatisfaction."></p>
            </div>

            <!-- Puedes repetir el formato para tus 8 proyectos -->
        </div>

        <!-- Contacto -->
        <div class="section">
            <h2 data-es="Contacto" data-en="Contact"></h2>
            <p>📧 <a href="mailto:daviddanielgn@outlook.com">daviddanielgn@outlook.com</a></p>
            <p>🔗 <a href="#">LinkedIn</a></p>
            <p>🐙 <a href="#">GitHub</a></p>
            <p data-es="Perú" data-en="Peru"></p>
        </div>

    </div>

    <footer>
        © 2025 David Gozar — Data Analyst
    </footer>

    <script>
        function setLang(lang) {
            document.querySelectorAll("[data-es]").forEach(el => {
                el.innerHTML = el.getAttribute(`data-${lang}`);
            });
        }
        setLang("es");
    </script>

</body>
</html>
